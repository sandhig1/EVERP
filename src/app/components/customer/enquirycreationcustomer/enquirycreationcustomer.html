<div class="page-container">

  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left">
        <h1>New Enquiry</h1>

        <div class="breadcrumb">
        <span class="home-icon">⌂</span>
        <span>My Enquiries</span>
        <span class="arrow">›</span>
        <span>New Enquiry</span>
        </div>
    </div>

    <button
        type="button"
        class="btn-enquiry-list"
        (click)="goToEnquiryList()">
        <span class="list-icon">☷</span>
        Enquiry List
  </button>

  </div>

  <!-- Enquiry Card -->
  <div class="enquiry-card">

    <h2>Enquiry Details</h2>

    <form (ngSubmit)="submitEnquiry()" #enquiryForm="ngForm">

      <!-- =========================================
           FIRST ROW
           Charger Type | Preferred Date
      ========================================== -->

      <div class="form-row three-columns">

        <!-- Charger Type -->
        <div class="form-group">
          <label for="chargerType">
            Charger Type <span class="required">*</span>
          </label>

          <select
            id="chargerType"
            name="chargerType"
            [(ngModel)]="enquiry.chargerType"
            required>

            <option value="" disabled>
              Select charger type
            </option>

            <option value="ac">AC Charger</option>
            <option value="dc">DC Charger</option>
            <option value="fast">Fast Charger</option>

          </select>
        </div>


        <!-- Preferred Date -->
        <div class="form-group">
          <label for="preferredDate">
            Preferred Date <span class="required">*</span>
          </label>

          <div class="date-input-wrapper">

            <input
              type="date"
              id="preferredDate"
              name="preferredDate"
              [(ngModel)]="enquiry.preferredDate"
              required>

          </div>
        </div>

      </div>


      <!-- =========================================
           SITE ADDRESS
      ========================================== -->

      <div class="form-group full-width">

        <label for="siteAddress">
          Site Address <span class="required">*</span>
        </label>

        <input
          type="text"
          id="siteAddress"
          name="siteAddress"
          [(ngModel)]="enquiry.siteAddress"
          placeholder="Enter site address"
          required>

      </div>


      <!-- =========================================
           CITY & STATE
      ========================================== -->

      <div class="form-row two-columns">

        <!-- City -->
        <div class="form-group">

          <label for="city">
            City <span class="required">*</span>
          </label>

          <select
            id="city"
            name="city"
            [(ngModel)]="enquiry.city"
            required>

            <option value="" disabled>
              Select city
            </option>

            <option value="ahmedabad">Ahmedabad</option>
            <option value="bangalore">Bangalore</option>
            <option value="chennai">Chennai</option>
            <option value="delhi">Delhi</option>
            <option value="hyderabad">Hyderabad</option>
            <option value="jaipur">Jaipur</option>
            <option value="kolkata">Kolkata</option>
            <option value="mumbai">Mumbai</option>
            <option value="pune">Pune</option>

          </select>

        </div>


        <!-- State -->
        <div class="form-group">

          <label for="state">
            State <span class="required">*</span>
          </label>

          <select
            id="state"
            name="state"
            [(ngModel)]="enquiry.state"
            required>

            <option value="" disabled>
              Select state
            </option>

            <option value="andhra-pradesh">Andhra Pradesh</option>
            <option value="delhi">Delhi</option>
            <option value="gujarat">Gujarat</option>
            <option value="haryana">Haryana</option>
            <option value="karnataka">Karnataka</option>
            <option value="kerala">Kerala</option>
            <option value="maharashtra">Maharashtra</option>
            <option value="rajasthan">Rajasthan</option>
            <option value="tamil-nadu">Tamil Nadu</option>
            <option value="telangana">Telangana</option>
            <option value="west-bengal">West Bengal</option>

          </select>

        </div>

      </div>


      <!-- =========================================
           REQUIREMENT DETAILS
      ========================================== -->

      <div class="form-group full-width requirement-group">

        <label for="requirementDetails">
          Requirement Details
        </label>

        <textarea
          id="requirementDetails"
          name="requirementDetails"
          [(ngModel)]="enquiry.requirementDetails"
          placeholder="Enter requirement details">
        </textarea>

      </div>


      <!-- =========================================
           ACTION BUTTONS
      ========================================== -->

      <div class="form-actions">

        <button
          type="button"
          class="btn-cancel"
          (click)="cancelEnquiry()">

          Cancel

        </button>


        <button
          type="submit"
          class="btn-submit"
          [disabled]="enquiryForm.invalid">

          Submit Enquiry

        </button>

      </div>

    </form>

  </div>

</div>
