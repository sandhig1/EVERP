<div class="signup-page">

  <div class="signup-card">

    <!-- =====================================================
         LEFT BRANDING SECTION
    ====================================================== -->
    <div class="branding-panel">

      <!-- Brand Logo -->
      <div class="brand">

        <div class="brand-logo">
          <div class="logo-circle">
            <span class="logo-bolt">⚡</span>
          </div>
        </div>

        <div class="brand-name">
          <span>EV Charging</span>
          <span>Solutions ERP</span>
        </div>

      </div>


      <!-- EV Illustration -->
      <div class="ev-illustration">
        <img
          src="assets/images/ev-signup-illustration.png"
          alt="EV Charging Solutions"
        />
      </div>


      <!-- Copyright -->
      <div class="branding-footer">
        © 2025 EV Charging Solutions ERP. All rights reserved.
      </div>

    </div>


    <!-- =====================================================
         RIGHT FORM SECTION
    ====================================================== -->
    <div class="form-panel">

      <div class="form-container">

        <!-- Header -->
        <div class="form-header">
          <h1>Create Your Account</h1>

          <p>
            Join us and be a part of the EV revolution
          </p>
        </div>


        <!-- =================================================
             SIGNUP FORM
        ================================================== -->
        <form>


          <!-- FULL NAME -->
          <div class="form-group">

            <label for="fullName">
              Full Name
            </label>

            <div class="input-wrapper">

              <span class="input-icon person-icon">
                <i class="fa fa-user"></i>
              </span>

              <input
                id="fullName"
                type="text"
                placeholder="Enter your full name"
              />

            </div>

          </div>


          <!-- EMAIL -->
          <div class="form-group">

            <label for="email">
              Email
            </label>

            <div class="input-wrapper">

              <span class="input-icon">
                <i class="fa fa-envelope"></i>
              </span>

              <input
                id="email"
                type="email"
                placeholder="Enter your email"
              />

            </div>

          </div>


          <!-- PHONE -->
          <div class="form-group">

            <label for="phone">
              Phone Number
            </label>

            <div class="input-wrapper">

              <span class="input-icon phone-icon">
                <i class="fa fa-phone"></i>
              </span>

              <input
                id="phone"
                type="tel"
                placeholder="Enter your phone number"
              />

            </div>

          </div>


          <!-- USER TYPE -->
<div class="form-group">

  <label>
    User Type
  </label>

  <div class="user-type-wrapper">

    <div class="user-type-option">
      <input
        type="radio"
        id="admin"
        name="userType"
        value="admin"
      />

      <label for="admin">
        <span class="radio-circle"></span>
        Admin
      </label>
    </div>


    <div class="user-type-option">
      <input
        type="radio"
        id="dealer"
        name="userType"
        value="dealer"
      />

      <label for="dealer">
        <span class="radio-circle"></span>
        Dealer
      </label>
    </div>


    <div class="user-type-option">
      <input
        type="radio"
        id="technician"
        name="userType"
        value="technician"
      />

      <label for="technician">
        <span class="radio-circle"></span>
        Technician
      </label>
    </div>

    <div class="user-type-option">
      <input
        type="radio"
        id="customer"
        name="userType"
        value="customer"
      />

      <label for="customer">
        <span class="radio-circle"></span>
        Customer
      </label>
    </div>

  </div>

</div>


          <!-- PASSWORD -->
          <div class="form-group">

            <label for="password">
              Password
            </label>

            <div class="input-wrapper">

              <span class="input-icon">
                <i class="fa fa-lock"></i>
              </span>

              <input
                id="password"
                type="password"
                placeholder="Enter password"
              />

            </div>

          </div>


          <!-- TERMS -->
          <div class="terms-row">

            <label class="checkbox-container">

              <input
                type="checkbox"
                id="terms"
              />

              <span class="custom-checkbox"></span>

              <span class="terms-text">

                I agree to the

                <a href="#">
                  Terms &amp; Conditions
                </a>

                and

                <a href="#">
                  Privacy Policy
                </a>

              </span>

            </label>

          </div>


          <!-- SIGN UP BUTTON -->
          <button
            type="submit"
            class="signup-button"
          >
            Sign Up
          </button>


          <!-- LOGIN -->
          <div class="login-text">

            Already have an account?

            <a href="/login">
              Login
            </a>

          </div>

        </form>

      </div>

    </div>

  </div>

</div>
